<title>Rehearsio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600&family=Playfair+Display:ital,wght@1,400;1,500&display=swap">

<style>
  /* ============================================================
     TOKENS — DESIGN.md verbatim.
     ============================================================ */
  :root {
    --color-iris-accent: #5551ff;
    --color-iris-soft: #a95ef8;
    --color-cream-paper: #f5f1e4;
    --color-ink-warm: #2c2e2a;
    --color-pure-white: #ffffff;
    --color-sandstone: #e0dbce;
    --color-slate: #80827f;
    --color-hairline: #d5d5d4;

    --font-poppins: 'Poppins', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-editorial: 'Playfair Display', 'Iowan Old Style', Georgia, serif;

    --text-caption: 12px;
    --text-body-sm: 14px;
    --text-body: 16px;
    --text-subheading: 20px;
    --text-heading-sm: 25px;
    --text-heading: clamp(30px, 3.6vw, 40px);
    --text-display: clamp(40px, 5.4vw, 64px);
    --tracking-display: -1.98px;
    --tracking-heading: -0.8px;

    --radius-cards: 40px;
    --radius-buttons: 50px;
    --radius-nav: 50px;
    --radius-inputs: 50px;
    --radius-small: 10px;

    --page-max-width: 1200px;
    --section-gap: 100px;
    --card-padding: 24px;
    --gap-xs: 8px;
    --gap-sm: 12px;
    --gap-md: 20px;
    --gap-lg: 32px;
    --gap-xl: 48px;
    --page-gutter: 24px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* Explicit ground: the host paints its own background behind the page,
       so a transparent body would borrow a dark theme's ground. */
    background: var(--color-cream-paper);
    color: var(--color-ink-warm);
    font-family: var(--font-poppins);
    font-size: var(--text-body);
    font-weight: 400;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  h1, h2, h3, h4, p { margin: 0; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  a { color: inherit; text-decoration: none; }

  :focus-visible { outline: 2px solid var(--color-iris-accent); outline-offset: 3px; }

  /* ============================================================
     PRIMITIVES
     ============================================================ */
  .shell {
    width: 100%;
    max-width: var(--page-max-width);
    margin-inline: auto;
    padding-inline: var(--page-gutter);
  }

  .eyebrow {
    font-size: var(--text-caption);
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--color-slate);
  }

  .h-display {
    font-size: var(--text-display);
    font-weight: 500;
    line-height: 1.0;
    letter-spacing: var(--tracking-display);
    text-wrap: balance;
  }

  .h-section {
    font-size: var(--text-heading);
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: var(--tracking-heading);
    text-wrap: balance;
  }

  .h-card { font-size: var(--text-subheading); font-weight: 600; line-height: 1.4; letter-spacing: -0.2px; }
  .accent-word { color: var(--color-iris-accent); }
  .lede { font-size: var(--text-subheading); line-height: 1.4; letter-spacing: -0.2px; color: var(--color-slate); }
  .muted { color: var(--color-slate); }
  .body-sm { font-size: var(--text-body-sm); line-height: 1.55; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    font-size: var(--text-body);
    font-weight: 600;
    line-height: 1;
    padding: 16px 32px;
    border-radius: var(--radius-buttons);
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: background-color .18s ease, color .18s ease, border-color .18s ease, transform .18s ease;
  }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

  .btn-accent { background: var(--color-iris-accent); color: var(--color-pure-white); border-color: var(--color-iris-accent); }
  .btn-accent:hover { background: #423ff0; border-color: #423ff0; }
  .btn-accent:active { transform: translateY(1px); }

  .btn-ghost { background: transparent; color: var(--color-ink-warm); border-color: var(--color-ink-warm); }
  .btn-ghost:hover { background: var(--color-ink-warm); color: var(--color-cream-paper); }
  .btn-ghost:active { transform: translateY(1px); }

  .btn-sm { font-size: var(--text-body-sm); padding: 11px 22px; }

  .card { background: var(--color-pure-white); border-radius: var(--radius-cards); padding: var(--card-padding); }

  /* ============================================================
     NAV
     ============================================================ */
  .nav-wrap {
    position: sticky;
    top: 0;
    z-index: 60;
    padding-top: 16px;
    padding-bottom: 10px;
    /* Cream band above the pill: without it, content slides through the gap
       between viewport top and the floating nav and gets sliced in half. */
    background: var(--color-cream-paper);
  }
  .nav {
    display: flex;
    align-items: center;
    gap: var(--gap-md);
    background: var(--color-pure-white);
    border-radius: var(--radius-nav);
    padding: 10px 10px 10px 26px;
  }
  .wordmark {
    display: inline-flex;
    align-items: baseline;
    gap: var(--gap-xs);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.4px;
    white-space: nowrap;
  }
  .wordmark .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-iris-soft); align-self: center; flex: none; }

  .nav-links { display: flex; gap: 26px; margin-inline-start: auto; }
  .nav-links a {
    font-size: var(--text-body-sm);
    font-weight: 500;
    padding-block: 4px;
    border-bottom: 1.5px solid transparent;
    transition: border-color .18s ease;
  }
  .nav-links a:hover { border-bottom-color: var(--color-ink-warm); }

  .lang { display: flex; align-items: center; gap: 6px; font-size: var(--text-body-sm); font-weight: 500; }
  .lang button {
    background: none; border: 0; cursor: pointer; padding: 4px 2px;
    font-family: inherit; font-size: inherit; font-weight: 500;
    color: var(--color-slate);
  }
  .lang button[aria-pressed="true"] { color: var(--color-ink-warm); }
  .lang button:hover { color: var(--color-ink-warm); }
  .lang .sep { color: var(--color-hairline); }

  /* ============================================================
     HERO
     ============================================================ */
  .hero {
    padding-block: 64px 90px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--gap-lg);
    text-align: center;
  }
  /* Free/no-signup promise is the segment's first filter, so it gets real
     size instead of the 12px eyebrow it used to hide in. */
  .free-badge {
    display: inline-block;
    background: var(--color-sandstone);
    border-radius: var(--radius-buttons);
    padding: 10px 24px;
    font-size: var(--text-subheading);
    font-weight: 500;
    letter-spacing: -0.2px;
  }
  .hero h1 { max-width: 850px; }
  .hero .lede { max-width: 40ch; }

  .paste { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: var(--gap-sm); align-items: center; }
  .paste-field {
    width: 100%;
    background: var(--color-pure-white);
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-inputs);
    padding: 16px 24px;
    display: flex;
    transition: border-color .18s ease, border-radius .2s ease;
  }
  .paste-field:hover { border-color: var(--color-slate); }
  /* Outline rather than a thicker border so focus never shifts layout,
     and not a shadow — DESIGN.md rules those out. */
  .paste-field:focus-within,
  .paste-field:focus-within:hover {
    border-color: var(--color-iris-accent);
    outline: 1.5px solid var(--color-iris-accent);
    outline-offset: -1px;
  }
  .paste-field.is-open { border-radius: var(--radius-cards); }
  .paste-field textarea {
    flex: 1;
    border: 0; background: transparent; resize: none;
    font-family: inherit; font-size: var(--text-body); line-height: 1.5;
    color: var(--color-ink-warm);
    height: calc(1.5 * var(--text-body));
    max-height: 220px;
    overflow-y: hidden;
    outline: none;
  }
  .paste-field.is-full textarea { overflow-y: auto; }
  .paste-field textarea::placeholder { color: var(--color-slate); }
  .paste-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--gap-sm); }
  .hero-note { font-size: var(--text-body-sm); color: var(--color-slate); max-width: 46ch; }

  /* ============================================================
     HOW IT WORKS
     ============================================================ */
  .section { padding-block: var(--section-gap); }

  .split-steps { display: grid; grid-template-columns: 5fr 7fr; gap: var(--gap-xl); align-items: start; }
  .sticky-head { position: sticky; top: 120px; }
  .sticky-head .eyebrow { display: block; margin-bottom: var(--gap-sm); }

  .steps { display: flex; flex-direction: column; gap: var(--gap-lg); }
  .step { display: grid; grid-template-columns: auto 1fr; gap: var(--gap-md); align-items: start; }
  .step-badge {
    width: 44px; height: 44px;
    border-radius: var(--radius-small);
    background: var(--color-ink-warm);
    color: var(--color-cream-paper);
    display: grid; place-items: center;
    font-size: var(--text-body-sm); font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .step-body h3 { margin-bottom: 6px; }
  .step-body p { color: var(--color-slate); max-width: 44ch; }

  /* ============================================================
     CALL — recessed sandstone panel inset in the cream canvas
     ============================================================ */
  .band-wrap { padding-block: var(--section-gap); }
  .band {
    background: var(--color-sandstone);
    border-radius: var(--radius-cards);
    padding: 62px 44px;
  }
  .band-head { display: flex; flex-direction: column; gap: var(--gap-sm); margin-bottom: var(--gap-xl); max-width: 26ch; }

  .call-mock {
    background: var(--color-pure-white);
    border-radius: var(--radius-cards);
    padding: 34px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: var(--gap-xl);
    align-items: center;
  }
  .call-stage { display: flex; flex-direction: column; align-items: center; gap: var(--gap-md); min-width: 210px; }
  .orb-holder { position: relative; display: grid; place-items: center; }
  .orb {
    width: 132px; height: 132px; border-radius: 50%;
    background: var(--color-cream-paper);
    border: 1.5px solid var(--color-hairline);
    display: grid; place-items: center;
    position: relative; z-index: 1;
    transition: border-color .3s ease;
  }
  .orb-ring { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--color-iris-soft); opacity: 0; }
  .call-mock[data-state="listening"] .orb { border-color: var(--color-iris-accent); }
  .call-mock[data-state="speaking"] .orb { border-color: var(--color-iris-soft); }
  .call-mock[data-state="listening"] .orb-ring,
  .call-mock[data-state="speaking"] .orb-ring { animation: ripple 1.9s ease-out infinite; }
  .call-mock[data-state="speaking"] .orb-ring:nth-child(2) { animation-delay: .5s; }
  @keyframes ripple {
    0%   { transform: scale(1);    opacity: .55; }
    100% { transform: scale(1.45); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .orb-ring { animation: none !important; opacity: 0; } }

  .wave { display: flex; align-items: center; gap: 5px; height: 44px; }
  .wave span { width: 4px; border-radius: 2px; background: var(--color-ink-warm); height: 10px; transition: height .25s ease; }
  .call-mock[data-state="listening"] .wave span { animation: bounce 1.1s ease-in-out infinite; }
  .call-mock[data-state="speaking"] .wave span { animation: bounce .7s ease-in-out infinite; }
  .wave span:nth-child(2) { animation-delay: .12s; }
  .wave span:nth-child(3) { animation-delay: .24s; }
  .wave span:nth-child(4) { animation-delay: .36s; }
  .wave span:nth-child(5) { animation-delay: .18s; }
  @keyframes bounce { 0%, 100% { height: 10px; } 50% { height: 38px; } }
  @media (prefers-reduced-motion: reduce) { .wave span { animation: none !important; } }

  .call-timer { font-size: var(--text-body-sm); font-weight: 500; color: var(--color-slate); font-variant-numeric: tabular-nums; }
  .state-chip {
    font-size: var(--text-caption); font-weight: 500;
    letter-spacing: 0.15em; text-transform: uppercase;
    padding: 7px 16px; border-radius: var(--radius-buttons);
    background: var(--color-cream-paper); white-space: nowrap;
  }

  .call-side { display: flex; flex-direction: column; gap: var(--gap-md); min-width: 0; }
  .transcript-label { font-size: var(--text-caption); letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-slate); }
  /* Reserves height for the longest question in the pool so swapping lines
     never makes the card jump. */
  .transcript { font-size: var(--text-subheading); line-height: 1.4; letter-spacing: -0.2px; min-height: 4.2em; }
  .caret { display: inline-block; width: 2px; height: 1em; background: var(--color-iris-accent); vertical-align: -2px; margin-left: 2px; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }

  .call-input-row { display: flex; gap: var(--gap-sm); align-items: center; }
  .call-input {
    flex: 1;
    background: var(--color-cream-paper);
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-inputs);
    padding: 14px 20px;
    font-size: var(--text-body-sm);
    color: var(--color-slate);
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .end-call {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--color-ink-warm); color: var(--color-cream-paper);
    display: grid; place-items: center; flex: none; font-size: var(--text-body-sm);
  }

  /* ============================================================
     REPORT
     ============================================================ */
  .split-report { display: grid; grid-template-columns: 4fr 8fr; gap: var(--gap-xl); align-items: start; }
  .report-points { display: flex; flex-direction: column; gap: var(--gap-sm); margin-top: var(--gap-lg); }
  .report-point { display: grid; grid-template-columns: auto 1fr; gap: var(--gap-sm); align-items: center; }
  .point-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--color-iris-soft); flex: none; }

  .report-card { display: flex; flex-direction: column; gap: var(--gap-md); padding: 32px; }
  .report-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: var(--gap-sm); flex-wrap: wrap;
    padding-bottom: var(--gap-sm);
    border-bottom: 1px solid var(--color-hairline);
  }
  .score-total { font-size: var(--text-heading-sm); font-weight: 600; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; }

  .q-rows { display: flex; flex-direction: column; gap: var(--gap-sm); }
  .q-row { display: grid; grid-template-columns: 1fr auto; gap: var(--gap-sm); align-items: center; }
  .q-row p { font-size: var(--text-body-sm); line-height: 1.4; }
  .q-meter { display: flex; align-items: center; gap: var(--gap-xs); }
  .meter-track { width: 76px; height: 6px; border-radius: 3px; background: var(--color-sandstone); overflow: hidden; }
  .meter-fill { height: 100%; background: var(--color-ink-warm); border-radius: 3px; }
  .q-score { font-size: var(--text-body-sm); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }

  .verdicts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-sm); }
  .verdict { background: var(--color-cream-paper); border-radius: var(--radius-small); padding: var(--gap-sm) 16px; }
  .verdict h4 {
    font-size: var(--text-caption); font-weight: 500;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--color-slate); margin-bottom: 6px;
  }
  .verdict p { font-size: var(--text-body-sm); line-height: 1.45; }

  /* ============================================================
     FAQ — native <details>: keyboard-accessible, no JS needed
     ============================================================ */
  .faq-inner { max-width: 760px; margin-inline: auto; }
  .faq-head { text-align: center; display: flex; flex-direction: column; gap: var(--gap-sm); margin-bottom: var(--gap-xl); align-items: center; }
  .faq-list { display: flex; flex-direction: column; gap: var(--gap-sm); }
  .faq-item { background: var(--color-pure-white); border-radius: var(--radius-cards); overflow: hidden; }
  .faq-q {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--gap-md); cursor: pointer;
    font-size: var(--text-subheading); font-weight: 500; letter-spacing: -0.2px;
    padding: var(--card-padding);
    list-style: none;
  }
  .faq-q::-webkit-details-marker { display: none; }
  .faq-q:hover { color: var(--color-iris-accent); }
  .faq-sign { flex: none; width: 22px; height: 22px; position: relative; }
  .faq-sign::before, .faq-sign::after {
    content: ""; position: absolute; background: currentColor; border-radius: 2px;
    inset-inline-start: 50%; inset-block-start: 50%;
  }
  .faq-sign::before { width: 14px; height: 1.5px; transform: translate(-50%, -50%); }
  .faq-sign::after  { width: 1.5px; height: 14px; transform: translate(-50%, -50%); transition: transform .2s ease, opacity .2s ease; }
  .faq-item[open] .faq-sign::after { transform: translate(-50%, -50%) rotate(90deg); opacity: 0; }
  .faq-a { color: var(--color-slate); padding: 0 var(--card-padding) var(--card-padding); max-width: 62ch; }

  /* ============================================================
     FOOTER
     ============================================================ */
  .footer { padding-block: var(--section-gap) 40px; }
  .footer-cta { display: flex; flex-direction: column; align-items: center; gap: var(--gap-lg); text-align: center; }
  .footer-cta h2 { max-width: 18ch; }

  .footer-bar {
    margin-top: var(--section-gap);
    padding-top: var(--gap-md);
    border-top: 1px solid var(--color-hairline);
    display: flex; flex-wrap: wrap; gap: var(--gap-md);
    align-items: flex-end; justify-content: space-between;
    font-size: var(--text-body-sm); color: var(--color-slate);
  }
  .footer-lockup { display: flex; flex-direction: column; gap: 2px; }
  .footer-lockup .wordmark { font-size: var(--text-heading-sm); letter-spacing: -0.6px; color: var(--color-ink-warm); }
  /* The single editorial (Playfair) moment on the page. */
  .tagline { font-family: var(--font-editorial); font-style: italic; font-size: var(--text-subheading); color: var(--color-slate); }
  .footer-bar nav { display: flex; gap: var(--gap-md); flex-wrap: wrap; }
  .footer-bar a:hover { color: var(--color-ink-warm); }

  /* ============================================================
     RESPONSIVE — 1280 / 768 / 360
     ============================================================ */
  @media (max-width: 900px) {
    .split-steps, .split-report { grid-template-columns: 1fr; gap: var(--gap-lg); }
    .sticky-head { position: static; }
    .call-mock { grid-template-columns: 1fr; gap: var(--gap-lg); }
    .call-stage { min-width: 0; }
    .report-points { margin-top: var(--gap-md); }
    .transcript { min-height: 5.6em; }
  }

  /* Links go before they wrap: below this the labels no longer fit on one
     line inside the pill and push it to double height. */
  @media (max-width: 880px) {
    .nav-links { display: none; }
    .nav { padding-inline-start: 20px; }
    .lang { margin-inline-start: auto; }
  }

  @media (max-width: 760px) {
    .verdicts { grid-template-columns: 1fr; }
    .hero { padding-block: 40px 72px; }
    .band { padding: 40px 22px; }
    .footer-bar { align-items: flex-start; }
  }

  @media (max-width: 420px) {
    :root { --page-gutter: 16px; --section-gap: 72px; }
    .btn { padding: 15px 24px; width: 100%; }
    .paste-actions { width: 100%; }
    .call-mock { padding: var(--card-padding); }
    .report-card { padding: var(--card-padding); }
    .free-badge { font-size: var(--text-body); padding: 9px 20px; }
    .footer-bar { flex-direction: column; }
    .transcript { min-height: 7em; }
  }
</style>

<header class="nav-wrap">
  <div class="shell">
    <nav class="nav">
      <span class="wordmark"><span class="dot"></span>Rehearsio</span>
      <div class="nav-links">
        <a href="#how" data-i18n="nav.how"></a>
        <a href="#call" data-i18n="nav.call"></a>
        <a href="#report" data-i18n="nav.report"></a>
        <a href="#faq" data-i18n="nav.faq"></a>
      </div>
      <div class="lang">
        <button type="button" id="langRu" aria-pressed="true">RU</button>
        <span class="sep">·</span>
        <button type="button" id="langEn" aria-pressed="false">EN</button>
      </div>
      <button class="btn btn-sm btn-ghost" id="navCta" type="button" data-i18n="nav.cta"></button>
    </nav>
  </div>
</header>

<main>
  <!-- ===================== HERO ===================== -->
  <section class="shell hero">
    <span class="free-badge" data-i18n="hero.badge"></span>
    <h1 class="h-display" data-i18n="hero.h1"></h1>
    <p class="lede" data-i18n="hero.sub"></p>

    <div class="paste">
      <div class="paste-field" id="pasteField">
        <textarea id="vacancyInput" rows="1" data-i18n-placeholder="hero.placeholder" aria-label="Job post"></textarea>
      </div>
      <div class="paste-actions">
        <button class="btn btn-accent" id="heroCta" type="button" data-i18n="hero.cta"></button>
        <button class="btn btn-ghost" id="resumeBtn" type="button" data-i18n="hero.resume"></button>
      </div>
      <p class="hero-note" data-i18n="hero.note"></p>
    </div>
  </section>

  <!-- ===================== HOW ===================== -->
  <section class="shell section" id="how">
    <div class="split-steps">
      <div class="sticky-head">
        <span class="eyebrow" data-i18n="how.eyebrow"></span>

  function detectLang() {
    try {
      var saved = localStorage.getItem(LANG_KEY);
      if (saved === 'ru' || saved === 'en') return saved;
    } catch (e) { /* private mode, fall through to detection */ }
    var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'ru';
    return nav.toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en';
  }

    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      el.innerHTML = t(el.getAttribute('data-i18n'));

    document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
      el.placeholder = t(el.getAttribute('data-i18n-placeholder'));

    document.getElementById('langEn').setAttribute('aria-pressed', String(lang === 'en'));
    refreshCall();

    lang = next;
    try { localStorage.setItem(LANG_KEY, next); } catch (e) { /* choice just won't persist */ }

  }

      var lonely = visible.size === 0;
      navCta.classList.toggle('btn-accent', lonely);
      navCta.classList.toggle('btn-ghost', !lonely);
    }, { threshold: 0 });
    io.observe(heroCta);
    io.observe(footerCta);
  }

  function focusPaste() {
    document.querySelector('.hero').scrollIntoView({
      behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
      block: 'start'
    });
    setTimeout(function () { ta.focus(); }, 420);
  }
  navCta.addEventListener('click', focusPaste);
  footerCta.addEventListener('click', focusPaste);
  document.getElementById('resumeBtn').addEventListener('click', focusPaste);
  heroCta.addEventListener('click', function () { ta.focus(); });

  /* ============================================================
     LIVE CALL MOCK
     Walks a shuffled pool of real interview questions so the preview shows
     the kind of thing that actually gets asked, and a different one each
     visit, instead of one canned line.
     ============================================================ */
  var mock = document.getElementById('callMock');
  var chip = document.getElementById('stateChip');
  var label = document.getElementById('transcriptLabel');
  var line = document.getElementById('transcript');
  var timerEl = document.getElementById('callTimer');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var order = [];      // shuffled indices into the question pool
  var cursor = 0;      // which pool entry we're on
  var step = 0;        // 0 question, 1 candidate answer, 2 interviewer thinking
  var typeTimer = null;
  var holdTimer = null;
  var running = false;

  function shuffle(n) {
    var a = [];
    for (var i = 0; i < n; i++) a.push(i);
    for (var j = a.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var tmp = a[j]; a[j] = a[k]; a[k] = tmp;
    }
    return a;
  }

  function currentBeat() {
    var pool = t('call.pool');
    if (!pool || !pool.length) return null;
    var pair = pool[order[cursor] % pool.length];
    if (step === 0) return { state: 'speaking',  chip: t('call.chipSpeaking'),  label: t('call.labelQ'), text: pair.q, hold: 3800 };
    if (step === 1) return { state: 'listening', chip: t('call.chipListening'), label: t('call.labelA'), text: pair.a, hold: 3000 };
    return { state: 'thinking', chip: t('call.chipThinking'), label: t('call.labelQ'), text: '', hold: 1100 };
  }

  function clearTimers() {
    if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  }

  function typeOut(text, done) {
    line.textContent = '';
    if (reduced || !text) { line.textContent = text; done(); return; }
    var i = 0;
    var caret = document.createElement('span');
    caret.className = 'caret';
    line.appendChild(caret);
    typeTimer = setInterval(function () {
      i += 1;
      caret.remove();
      line.textContent = text.slice(0, i);
      if (i < text.length) {
        line.appendChild(caret);
      } else {
        clearInterval(typeTimer);
        typeTimer = null;
        done();
      }
    }, 24);
  }

  function paintBeat(b) {
    mock.setAttribute('data-state', b.state);
    chip.textContent = b.chip;
    label.textContent = b.label;
  }

  function playBeat() {
    var b = currentBeat();
    if (!b) return;
    paintBeat(b);
    clearTimers();
    typeOut(b.text, function () {
      holdTimer = setTimeout(function () {
        step += 1;
        if (step > 2) { step = 0; cursor = (cursor + 1) % order.length; }
        playBeat();
      }, b.hold);
    });
  }

  /* The loop only starts once the mock scrolls into view, so paint the current
     beat statically up front. Otherwise the chip, label and transcript sit
     empty and the mock looks broken to anyone who sees it early. */
  function paintStatic() {
    var b = currentBeat();
    if (!b) return;
    paintBeat(b);
    line.textContent = b.text;
  }

  /* Called on boot and on every language switch, so the demo always speaks
     the language the page is currently in. */
  function refreshCall() {
    var pool = t('call.pool');
    if (!order.length && pool) order = shuffle(pool.length);
    clearTimers();
    if (running) { playBeat(); } else { paintStatic(); }
  }

  var seconds = 252;
  setInterval(function () {
    seconds += 1;
    var m = String(Math.floor(seconds / 60)).padStart(2, '0');
    var s = String(seconds % 60).padStart(2, '0');
    timerEl.textContent = m + ':' + s;
  }, 1000);

  /* ---------------- Boot ---------------- */
  lang = detectLang();
  applyLang();
  autoGrow();

  function startCall() {
    if (running) return;
    running = true;
    playBeat();
  }

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) startCall();
    }, { threshold: 0.25 }).observe(mock);

    /* IntersectionObserver never fires while the document is hidden (page opened
       in a background tab, or a preview pane that isn't on screen), so the demo
       would stay frozen on its first frame even after the reader switches to it.
       Re-check once the page actually becomes visible. */
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      var r = mock.getBoundingClientRect();
      if (r.top < window.innerHeight && r.bottom > 0) startCall();
    });
  } else {
    startCall();
  }
})();
</script>
